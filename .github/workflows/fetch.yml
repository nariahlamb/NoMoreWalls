name: Fetch

on:
  workflow_dispatch:
  schedule:
    # 表达式生成 https://crontab.guru/
    - cron: '0 0/3 * * *'
  push:
    paths:
      - '.github/workflows/**'
      - '**.py'
      - 'requirements.txt'
      - 'README.md'

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REF_ONLY: ${{ vars.PUBLIC_REF_ONLY || 'false' }}
      CONFIG_GIST_ID: ${{ vars.CONFIG_GIST_ID || secrets.CONFIG_GIST_ID || '' }}
      RESULT_GIST_ID: ${{ vars.RESULT_GIST_ID || secrets.RESULT_GIST_ID || '' }}
      PRIVATE_RESULT_GIST_ID: ${{ vars.PRIVATE_RESULT_GIST_ID || secrets.PRIVATE_RESULT_GIST_ID || '' }}
    steps:
    - name: 迁出代码
      uses: actions/checkout@v4
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai'
    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'
    - name: 安装依赖
      run: pip install -r requirements.txt
    - name: 恢复私有抓取配置
      if: env.PUBLIC_REF_ONLY != 'true'
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      run: python ./restore_gist_files.py
    - name: 执行任务
      if: env.PUBLIC_REF_ONLY != 'true'
      run: python ./fetch.py
    - name: 同步公开结果到 Gist
      if: env.PUBLIC_REF_ONLY != 'true'
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_SYNC_DESCRIPTION: NoMoreWalls generated outputs
      run: python ./sync_gist.py
    - name: 同步私有诊断结果到 Gist
      if: env.PUBLIC_REF_ONLY != 'true' && env.PRIVATE_RESULT_GIST_ID != ''
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        GIST_SYNC_DESCRIPTION: NoMoreWalls private diagnostics
      run: >-
        python ./sync_gist.py
        --gist-id-variable PRIVATE_RESULT_GIST_ID
        --pattern list_raw.txt
        --pattern list_result.csv
        --pattern artifacts/quality/*
    - name: 生成临时引用清单
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      run: python ./generate_public_refs.py
